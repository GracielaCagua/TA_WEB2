<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Tema 3 - Arrays en Bucles</title>
</head>
<body>
    <h1>Automatización de Arrays con Ciclos For</h1>

    <script type="text/javascript">
        // Creamos un array vacío para almacenar códigos de inventario
        var codigos_productos = new Array();
        
        // El bucle corre 10 veces (desde i=0 hasta i=9) e inserta un texto dinámico en cada posición
        for (var i = 0; i < 10; i++) {
            codigos_productos[i] = "Codigo_producto_" + i;
        }
        
        // Renderizamos los resultados en pantalla para verificar que funcionó
        document.write("<h3>Lista de códigos generados mediante el bucle:</h3>");
        document.write("<ul>");
        for (var j = 0; j < codigos_productos.length; j++) {
            document.write("<li>Posición [" + j + "]: " + codigos_productos[j] + "</li>");
        }
        document.write("</ul>");
    </script>
</body>
</html>
