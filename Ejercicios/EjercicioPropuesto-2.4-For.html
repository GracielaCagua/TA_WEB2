<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Ejercicio 4 - Cuenta atrás con For</title>
</head>
<body>

    <script type="text/javascript">
        // Pedimos el número inicial al usuario
        var numeroInicial = prompt("Introduce un número para iniciar la cuenta atrás: ");

        // Estructura For: Inicialización; Condición; Decremento
        for (var countdown = numeroInicial; countdown > 0; countdown--) {
            alert(countdown + "... ");
        }
    </script>

</body>
</html>
