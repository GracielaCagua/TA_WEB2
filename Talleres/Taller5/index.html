<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sistema de Registro Académico</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>

    <div class="main-card">
        <div class="card-header">
            <h2>Registro de Matrícula Estudiantil</h2>
            <p>Complete los datos del estudiante para el almacenamiento local</p>
        </div>
        
        <form id="studentForm">
            <div class="form-row">
                <div class="form-group">
                    <label for="cedula">Número de Cédula</label>
                    <input type="text" id="cedula" placeholder="Ej. 131XXXXXXX" required>
                </div>
                <div class="form-group">
                    <label for="correo">Correo Electrónico</label>
                    <input type="email" id="correo" placeholder="ejemplo@correo.com" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="apellidos">Apellidos Completos</label>
                    <input type="text" id="apellidos" placeholder="Apellidos" required>
                </div>
                <div class="form-group">
                    <label for="nombres">Nombres Completos</label>
                    <input type="text" id="nombres" placeholder="Nombres" required>
                </div>
            </div>

            <div class="form-row">
                <div class="form-group">
                    <label for="direccion">Dirección de Domicilio</label>
                    <input type="text" id="direccion" placeholder="Calle / Av. / Barrio" required>
                </div>
                <div class="form-group">
                    <label for="telefono">Teléfono / Celular</label>
                    <input type="text" id="telefono" placeholder="Ej. 099XXXXXXX" required>
                </div>
            </div>

            <div class="form-row thirds">
                <div class="form-group">
                    <label for="facultad">Facultad</label>
                    <input type="text" id="facultad" placeholder="Facultad" required>
                </div>
                <div class="form-group">
                    <label for="nivel">Nivel</label>
                    <input type="text" id="nivel" placeholder="Ej. Sexto" required>
                </div>
                <div class="form-group">
                    <label for="paralelo">Paralelo</label>
                    <input type="text" id="paralelo" placeholder="Ej. A" required>
                </div>
            </div>

            <button type="submit" class="btn-submit">Guardar Registro</button>
        </form>

        <div id="mensaje"></div>

        <div class="records-section">
            <h3>Estudiantes Guardados en el Sistema</h3>
            <div class="table-container">
                <table id="tablaEstudiantes">
                    <thead>
                        <tr>
                            <th>Identificación</th>
                            <th>Estudiante</th>
                            <th>Contacto</th>
                            <th>Ubicación Académica</th>
                        </tr>
                    </thead>
                    <tbody>
                        </tbody>
                </table>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
